name: process_fakes
publish_to: none

# Required for workspace support.
environment:
  sdk: ^3.7.0-0

# This package is managed as part of the engine workspace.
resolution: workspace

dependencies:
  file: any
  meta: any
  path: any
  platform: any
  process: any

dependency_overrides:
